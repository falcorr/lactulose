# release.yml
# When a new dist/lactulose-<version>.apk reaches main, publishes it as GitHub release v<version>. The APK is
# built and signed outside GitHub, so the signing key never leaves the project's shared folder.
name: release
on:
  push:
    branches: [main]
    paths: ['dist/*.apk']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the newest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(ls dist/lactulose-*.apk | sort -V | tail -1)"
          version="$(basename "$apk" .apk)"
          version="${version#lactulose-}"
          if gh release view "v$version" >/dev/null 2>&1; then echo "v$version already released"; exit 0; fi
          gh release create "v$version" "$apk" --target "$GITHUB_SHA" --title "v$version" --notes "Lactulose $version"
